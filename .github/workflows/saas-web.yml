name: saas-web

# Checks for apps/api and apps/web only. No deploy, no secrets, no real Clerk or database:
# identity is synthetic and PostgreSQL is a throwaway service container.
on:
  pull_request:
    paths: ["apps/**", ".github/workflows/saas-web.yml"]
  push:
    branches: ["feat/saas-web-foundation"]
    paths: ["apps/**", ".github/workflows/saas-web.yml"]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-ephemeral-password
          POSTGRES_DB: promo_api_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run python -m promo_api.openapi --check
      - run: uv run pytest
      - run: uv run pytest -m postgres
        env:
          PROMO_API_TEST_DATABASE_URL: postgresql+asyncpg://postgres:ci-ephemeral-password@127.0.0.1:5432/promo_api_test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run check:api
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # Synthetic, build-only values: base64("synthetic-instance.clerk.accounts.dev$").
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_c3ludGhldGljLWluc3RhbmNlLmNsZXJrLmFjY291bnRzLmRldiQ=
          CLERK_SECRET_KEY: sk_test_synthetic_build_only
          NEXT_PUBLIC_API_URL: http://localhost:8000
