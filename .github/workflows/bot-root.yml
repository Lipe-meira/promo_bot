name: bot-root

# Offline checks for the Python bot at the repository root (src/, tests/, migrations/). It mirrors
# the validation block of AGENTS.md. Separate from saas-web.yml, which covers apps/ only.
# No secrets, no deploy, no real Telegram/AliExpress/Shopee/Mercado Livre: the suite runs with
# `-m "not live and not browser"` and pytest-socket (--disable-socket, loopback only) from
# pyproject.toml, against temporary SQLite databases and fake transports.
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: bot-root-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: uv lock --check
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      # The bot is developed and run on Windows: its file locks use msvcrt/ctypes.windll behind
      # `os.name == "nt"`, which mypy only understands as `sys.platform`. Checking as win32 matches the
      # developer's own `mypy src` and avoids false attr-defined errors on the Linux runner.
      - run: uv run mypy --platform win32 src
      - run: uv run pytest -m "not live and not browser"

  # The ordered stop is a Windows concern (console events, a supervisor closing the input): its
  # tests also run there, with the same offline harness and fake Telegram client.
  windows-stop:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: >
          uv run pytest tests/unit/test_graceful_stop_queue.py
          tests/unit/test_graceful_stop_monitor.py tests/unit/test_graceful_stop_ordering.py
          tests/unit/test_graceful_stop_cli.py
